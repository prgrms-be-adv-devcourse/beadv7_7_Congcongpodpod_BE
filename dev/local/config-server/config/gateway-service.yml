spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      connect-timeout: 5s
      timeout: 5s
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/api/**]":
                allowed-origins:
                  - ${GATEWAY_CORS_ORIGIN}
                  - ${GATEWAY_CORS_WWW_ORIGIN}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type]
                max-age: 3600
          routes:
            - id: core-service
              uri: ${CORE_SERVICE_URL}
              predicates:
                - Path=/api/v1/carts/**,/api/v1/orders/**,/api/v1/stores/**,/api/v1/dishes/**,/api/v1/settlements/**,/api/v1/deposits/**,/api/v1/levels/**,/api/v1/points/**,/api/v1/favorites/**,/api/v1/locations/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
              predicates:
                - Path=/api/v1/payments/**
            - id: member-service
              uri: ${MEMBER_SERVICE_URL}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/members/**,/api/v1/notifications/**
            - id: ai-service
              uri: ${AI_SERVICE_URL}
              predicates:
                - Path=/api/v1/ai/**
            - id: member-openapi
              uri: ${MEMBER_SERVICE_URL}
              predicates:
                - Path=/openapi/member-service
              filters:
                - SetPath=/v3/api-docs
            - id: core-openapi
              uri: ${CORE_SERVICE_URL}
              predicates:
                - Path=/openapi/core-service
              filters:
                - SetPath=/v3/api-docs
            - id: payment-openapi
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/openapi/payment-service
              filters:
                - SetPath=/v3/api-docs
            - id: ai-openapi
              uri: ${AI_SERVICE_URL}
              predicates:
                - Path=/openapi/ai-service
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: member-service
        url: /openapi/member-service
      - name: core-service
        url: /openapi/core-service
      - name: payment-service
        url: /openapi/payment-service
      - name: ai-service
        url: /openapi/ai-service

gateway:
  security:
    jwt:
      issuer: lastdish-member-service
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,refresh,prometheus
  endpoint:
    gateway:
      access: unrestricted
