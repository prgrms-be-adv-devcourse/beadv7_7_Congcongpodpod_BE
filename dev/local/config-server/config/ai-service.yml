spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:redis_local_password}
      connect-timeout: 1s
      timeout: 1s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "ai-service:"
  datasource:
    # AI 전용 논리 DB입니다. Core·Payment 데이터는 API나 이벤트로 전달받아 가공합니다.
    url: ${AI_DB_URL:jdbc:postgresql://localhost:54322/ai_db}
    username: ${AI_DB_USERNAME:ai}
    password: ${AI_DB_PASSWORD:ai_local_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    # 아직 AI 영속 모델과 마이그레이션이 없으므로 자동 DDL을 금지합니다.
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    # ai_db의 AI 테이블과 outbox_events는 AI Flyway만 관리합니다.
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ai-service}
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:elastic_local_password}

event:
  publisher: ${EVENT_PUBLISHER:kafka}

outbox:
  scheduler:
    enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
  polling-delay-ms: ${OUTBOX_POLLING_DELAY_MS:1000}
  batch-size: 100
  lock-timeout-seconds: 60
  max-retries: 5

inbox:
  scheduler:
    enabled: ${INBOX_SCHEDULER_ENABLED:true}
  polling-delay-ms: ${INBOX_POLLING_DELAY_MS:1000}
  batch-size: ${INBOX_BATCH_SIZE:100}
  max-retries: ${INBOX_MAX_RETRIES:5}
  lock-timeout-seconds: ${INBOX_LOCK_TIMEOUT_SECONDS:60}

swagger:
  servers:
    gateway-url: ${SWAGGER_GATEWAY_URL:http://localhost:8080}
    direct-url: ${SWAGGER_AI_DIRECT_URL:http://localhost:8084}
  cors:
    allowed-origin: ${SWAGGER_UI_ORIGIN:http://localhost:8080}

ai:
  engine:
    url: ${AI_ENGINE_URL:https://mushily-hangup-smartness.ngrok-free.dev}