spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      connect-timeout: 1s
      timeout: 1s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "ai-service:"
  datasource:
    url: ${AI_DB_URL}
    username: ${AI_DB_USERNAME}
    password: ${AI_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ai-service}
  elasticsearch:
    uris: ${ELASTICSEARCH_URL}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD}

event:
  publisher: ${EVENT_PUBLISHER:kafka}

outbox:
  scheduler:
    enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
  polling-delay-ms: ${OUTBOX_POLLING_DELAY_MS:1000}
  batch-size: ${OUTBOX_BATCH_SIZE:100}
  max-retries: ${OUTBOX_MAX_RETRIES:5}
  lock-timeout-seconds: ${OUTBOX_LOCK_TIMEOUT_SECONDS:60}

inbox:
  scheduler:
    enabled: ${INBOX_SCHEDULER_ENABLED:true}
  polling-delay-ms: ${INBOX_POLLING_DELAY_MS:1000}
  batch-size: ${INBOX_BATCH_SIZE:100}
  max-retries: ${INBOX_MAX_RETRIES:5}
  lock-timeout-seconds: ${INBOX_LOCK_TIMEOUT_SECONDS:60}

swagger:
  servers:
    gateway-url: ${SWAGGER_GATEWAY_URL:http://localhost:8080}
    direct-url: ${SWAGGER_AI_DIRECT_URL:http://localhost:8084}
  cors:
    allowed-origin: ${SWAGGER_UI_ORIGIN:http://localhost:8080}
