spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:redis_local_password}
      connect-timeout: 1s
      timeout: 1s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "payment-service:"
  datasource:
    # 같은 PostgreSQL 인스턴스의 독립 논리 DB인 payment_db에 연결합니다.
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:54322/payment_db}
    username: ${PAYMENT_DB_USERNAME:payment}
    password: ${PAYMENT_DB_PASSWORD:payment_local_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    # payment_db의 결제 테이블과 outbox_events는 Payment Flyway가 담당합니다.
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payment-service}

outbox:
  scheduler:
    enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
  polling-delay-ms: ${OUTBOX_POLLING_DELAY_MS:1000}
  batch-size: 100
  lock-timeout-seconds: 60
  max-retries: 5

toss:
  client-key: ${TOSS_CLIENT_KEY:test_ck_placeholder}
  secret-key: ${TOSS_SECRET_KEY:test_sk_placeholder}
