management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: kr.lastdish.common.event
        spring.json.value.default.type: kr.lastdish.common.event.EventMessage
        spring.json.use.type.headers: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    org.apache.kafka.common.config.AbstractConfig: WARN
  pattern:
    correlation: "[%X{requestId:-}] "
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:}
    json:
      customizer: kr.lastdish.common.api.logging.SystemZoneTimestampCustomizer
      exclude: ${LOGGING_STRUCTURED_JSON_EXCLUDE:ecs.version,process.pid,process.thread.name,service.node.name}
      stacktrace:
        max-length: ${LOGGING_STRUCTURED_STACKTRACE_MAX_LENGTH:2048}

request-log:
  skip-successful-actuator-calls: ${SKIP_SUCCESSFUL_ACTUATOR_LOGS:true}
