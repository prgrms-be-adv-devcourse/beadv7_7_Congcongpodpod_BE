spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:member-service}
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      connect-timeout: 5s
      timeout: 5s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "member-service:"
  datasource:
    url: ${MEMBER_DB_URL}
    username: ${MEMBER_DB_USERNAME}
    password: ${MEMBER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true

event:
  publisher: ${EVENT_PUBLISHER:kafka}

outbox:
  scheduler:
    enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
  polling-delay-ms: ${OUTBOX_POLLING_DELAY_MS:1000}
  batch-size: ${OUTBOX_BATCH_SIZE:100}
  max-retries: ${OUTBOX_MAX_RETRIES:5}
  lock-timeout-seconds: ${OUTBOX_LOCK_TIMEOUT_SECONDS:60}

inbox:
  scheduler:
    enabled: ${INBOX_SCHEDULER_ENABLED:true}
  polling-delay-ms: ${INBOX_POLLING_DELAY_MS:1000}
  batch-size: ${INBOX_BATCH_SIZE:100}
  max-retries: ${INBOX_MAX_RETRIES:5}
  lock-timeout-seconds: ${INBOX_LOCK_TIMEOUT_SECONDS:60}

jwt:
  rsa:
    access-private-key-location: ${JWT_ACCESS_PRIVATE_KEY_LOCATION}
    access-public-key-location: ${JWT_ACCESS_PUBLIC_KEY_LOCATION}
  access-token-validity-in-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
  refresh-token-validity-in-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}

kakao:
  oauth:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    admin-key: ${KAKAO_ADMIN_KEY}

swagger:
  servers:
    gateway-url: ${SWAGGER_GATEWAY_URL:http://localhost:8080}
    direct-url: ${SWAGGER_MEMBER_DIRECT_URL:http://localhost:8081}
  cors:
    allowed-origin: ${SWAGGER_UI_ORIGIN:http://localhost:8080}
