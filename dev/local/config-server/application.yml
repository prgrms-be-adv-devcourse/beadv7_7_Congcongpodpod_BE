management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: kr.lastdish.common.event
        spring.json.value.default.type: kr.lastdish.common.event.EventMessage
        spring.json.use.type.headers: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    org.apache.kafka.common.config.AbstractConfig: WARN
  pattern:
    correlation: "[%X{requestId:-}] "
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:}
    json:
      customizer: kr.lastdish.common.api.logging.SystemZoneTimestampCustomizer
      exclude: ${LOGGING_STRUCTURED_JSON_EXCLUDE:ecs,process,service.node,tags}
      stacktrace:
        max-length: ${LOGGING_STRUCTURED_STACKTRACE_MAX_LENGTH:2048}

request-log:
  skip-successful-actuator-calls: ${SKIP_SUCCESSFUL_ACTUATOR_LOGS:true}
  # 요청 1건이 실행한 SQL 문의 수를 완료 로그에 queryCount로 남긴다(#422·PR #423).
  # SQL 한 문장마다 ThreadLocal 접근이 있어 상시 운전할 성격이 아니다 — 측정할 때만 켜고 끝나면 끈다.
  # @ConditionalOnProperty가 기동 시 1회만 평가되므로 켜고 끄려면 파드 롤아웃이 필요하다.
  count-sql-statements: ${COUNT_SQL_STATEMENTS:false}
