spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      connect-timeout: 5s
      timeout: 5s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "payment-service:"
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payment-service}

event:
  publisher: ${EVENT_PUBLISHER:kafka}

outbox:
  scheduler:
    enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
  polling-delay-ms: ${OUTBOX_POLLING_DELAY_MS:1000}
  batch-size: ${OUTBOX_BATCH_SIZE:100}
  max-retries: ${OUTBOX_MAX_RETRIES:5}
  lock-timeout-seconds: ${OUTBOX_LOCK_TIMEOUT_SECONDS:60}
  cleanup:
    enabled: ${OUTBOX_CLEANUP_ENABLED:true}
    batch-size: ${OUTBOX_CLEANUP_BATCH_SIZE:1000}
    fixed-delay-ms: ${OUTBOX_CLEANUP_DELAY_MS:60000}

inbox:
  scheduler:
    enabled: ${INBOX_SCHEDULER_ENABLED:true}
  polling-delay-ms: ${INBOX_POLLING_DELAY_MS:1000}
  batch-size: ${INBOX_BATCH_SIZE:100}
  max-retries: ${INBOX_MAX_RETRIES:5}
  lock-timeout-seconds: ${INBOX_LOCK_TIMEOUT_SECONDS:60}
  cleanup:
    enabled: ${INBOX_CLEANUP_ENABLED:true}
    retention-days: ${INBOX_RETENTION_DAYS:3}
    batch-size: ${INBOX_CLEANUP_BATCH_SIZE:1000}
    fixed-delay-ms: ${INBOX_CLEANUP_DELAY_MS:60000}

toss:
  client-key: ${TOSS_CLIENT_KEY}
  secret-key: ${TOSS_SECRET_KEY}

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY}

swagger:
  servers:
    gateway-url: ${SWAGGER_GATEWAY_URL:http://localhost:8080}
    direct-url: ${SWAGGER_PAYMENT_DIRECT_URL:http://localhost:8083}
  cors:
    allowed-origin: ${SWAGGER_UI_ORIGIN:http://localhost:8080}
