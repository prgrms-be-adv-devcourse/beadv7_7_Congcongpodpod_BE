# 기본 postgres_exporter 지표에 없는 운영 병목 정보를 추가로 수집합니다.
# 쿼리 본인(pg_backend_pid)은 집계에서 제외해 관측 자체가 지표를 왜곡하지 않게 합니다.
pg_query_health:
  query: |
    SELECT
      current_database() AS datname,
      COUNT(*) FILTER (
        WHERE pid <> pg_backend_pid()
          AND state = 'active'
          AND query_start < clock_timestamp() - INTERVAL '30 seconds'
      )::double precision AS long_running_queries,
      COUNT(*) FILTER (
        WHERE pid <> pg_backend_pid()
          AND wait_event_type = 'Lock'
      )::double precision AS lock_waiting_queries,
      COALESCE(
        MAX(EXTRACT(EPOCH FROM clock_timestamp() - xact_start)) FILTER (
          WHERE pid <> pg_backend_pid()
            AND xact_start IS NOT NULL
        ),
        0
      )::double precision AS oldest_transaction_seconds
    FROM pg_stat_activity
    WHERE datname = current_database();
  metrics:
    - datname:
        usage: LABEL
        description: Database name.
    - long_running_queries:
        usage: GAUGE
        description: Queries running longer than 30 seconds.
    - lock_waiting_queries:
        usage: GAUGE
        description: Queries currently waiting for a PostgreSQL lock.
    - oldest_transaction_seconds:
        usage: GAUGE
        description: Age in seconds of the oldest transaction.
