# 캐시 전용 Redis Deployment와 클러스터 내부 Service를 선언합니다.
# 적용 전 redis-config ConfigMap과 redis-auth Secret이 data Namespace에 존재해야 합니다.
# 원본 데이터는 PostgreSQL에 있으므로 Redis 재생성 시 캐시가 비어도 서비스가 복구 가능해야 합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: data
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        # emptyDir /data를 비-root Redis 사용자(GID 999)가 사용할 수 있게 합니다.
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: redis
          image: redis:8.8.1-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - /etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          volumeMounts:
            - name: config
              mountPath: /etc/redis
              readOnly: true
            - name: auth
              mountPath: /etc/redis-auth
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: redis-config
        - name: auth
          secret:
            secretName: redis-auth
        - name: data
          emptyDir: {}
---
# 애플리케이션은 같은 클러스터에서 redis.data.svc.cluster.local:6379로 접근합니다.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
