# Gateway가 Member Service에서 발급한 Access Token 서명을 검증할 공개키입니다.
# 공개키라 ConfigMap에 저장하며, 대응하는 개인키는 절대 이 파일에 넣지 않습니다.
# 이 키를 교체하면 마운트 파일은 갱신되지만 애플리케이션이 재로딩하지 않을 수 있어 Gateway rollout을 권장합니다.
apiVersion: v1
kind: ConfigMap
metadata:
  # gateway-service.yaml의 volumes.configMap.name과 정확히 일치해야 합니다.
  name: gateway-jwt-public-key
  namespace: app
data:
  # 키 이름이 컨테이너에 마운트되는 파일명이 됩니다.
  access-public-key.pem: |
