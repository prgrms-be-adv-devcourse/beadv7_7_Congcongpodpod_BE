# app Namespace 서비스가 공유 Redis에 접속할 때 사용하는 주소·기본 ACL 사용자입니다.
# Redis 비밀번호는 data Namespace의 redis-auth Secret을 참조하며 ConfigMap에는 저장하지 않습니다.
# host·port·username 변경 후에는 이를 참조하는 Deployment를 rollout해야 합니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-client-config
  namespace: app
data:
  # Redis는 data 네임스페이스에 있으므로 Kubernetes 전체 Service DNS를 사용합니다.
  host: redis.data.svc.cluster.local
  port: "6379"
  # 현재 Redis ACL의 기본 사용자를 사용합니다. 비밀번호만 Secret으로 분리합니다.
  username: default
