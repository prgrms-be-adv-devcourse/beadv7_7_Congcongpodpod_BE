# 외부 API 요청의 단일 진입점으로 라우팅과 JWT 검증을 담당합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: app
  labels:
    app: gateway-service
spec:
  # 현재 단일 노드·소규모 트래픽 기준 1개 Pod를 운영합니다.
  replicas: 1
  # 신규 Pod가 Ready 상태가 된 뒤 기존 Pod를 종료해 설정 반영 중 서비스 공백을 방지합니다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # 신규 Pod가 10초간 Ready 상태를 유지해야 배포 성공으로 판단합니다.
  minReadySeconds: 10
  revisionHistoryLimit: 5
  # 아래 Pod template의 app label과 일치하는 Pod만 이 Deployment가 관리합니다.
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
      annotations:
        # Prometheus가 Pod IP의 Spring Actuator endpoint를 자동 발견해 수집합니다.
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-backends
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z config-server.platform.svc.cluster.local 8888 && nc -z member-service 80 && nc -z core-service 80 && nc -z payment-service 80 && nc -z ai-service 80; do sleep 5; done"]
          resources:
            requests: {cpu: 1m, memory: 4Mi}
            limits: {cpu: 10m, memory: 16Mi}
      containers:
        - name: gateway-service
          image: ghcr.io/prgrms-be-adv-devcourse/lastdish-gateway-service:dev
          imagePullPolicy: Always
          ports:
            # 이름을 http로 지정하면 Probe와 Service에서 숫자 대신 이름을 재사용할 수 있습니다.
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              # OS 레벨 시간대입니다.
              value: Asia/Seoul
            - name: JAVA_TOOL_OPTIONS
              # JVM 시간대도 별도로 고정해 로그와 날짜 계산 차이를 방지합니다.
              # Spring Boot 4 환경변수 변환의 모호성을 피해 시스템 속성의 점·하이픈을 정확히 전달합니다.
              # Heap 비율을 50%로 제한해 Reactor Netty direct buffer와 JVM native memory 여유를 확보합니다.
              value: >-
                -XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=50.0 -Duser.timezone=Asia/Seoul
                -Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true
            - name: CONFIG_SERVER_URL
              # namespace가 다른 Config Server의 Kubernetes 전체 DNS 이름입니다.
              value: http://config-server.platform.svc.cluster.local:8888
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
            - name: SPRINGDOC_ENABLED
              value: "true"
            - name: CORE_SERVICE_URL
              value: http://core-service
            - name: MEMBER_SERVICE_URL
              value: http://member-service
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service
            - name: AI_SERVICE_URL
              value: http://ai-service
            - name: GATEWAY_CORS_ORIGIN
              value: https://lastdish.kr
            - name: GATEWAY_CORS_WWW_ORIGIN
              value: https://www.lastdish.kr
            - name: JWT_PUBLIC_KEY_LOCATION
              # 아래 ConfigMap 볼륨이 실제로 마운트되는 컨테이너 내부 경로입니다.
              value: file:/etc/lastdish/jwt/access-public-key.pem
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  # data 네임스페이스 Redis Service의 Kubernetes DNS입니다.
                  name: app-runtime-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-runtime-config
                  key: REDIS_PORT
            - name: REDIS_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-runtime-config
                  key: REDIS_USERNAME
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Secret은 네임스페이스를 넘을 수 없어 app에도 동일 자격증명을 둡니다.
                  name: app-runtime-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            # ConfigMap의 각 data key가 이 디렉터리 아래 파일로 생성됩니다.
            - name: access-public-key
              mountPath: /etc/lastdish/jwt
              readOnly: true
          readinessProbe:
            # 준비된 Pod만 Service 트래픽을 받습니다.
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            # 5초 간격으로 최대 12회 실패를 허용해 일시적인 준비 지연을 흡수합니다.
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          startupProbe:
            # Spring 초기 기동이 끝날 때까지 liveness 판단을 유예합니다.
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            # 약 10분 동안 초기 기동을 허용한 뒤 실패하면 컨테이너를 재시작합니다.
            failureThreshold: 60
          livenessProbe:
            # 기동 후 응답 불능 상태가 지속되면 컨테이너를 재시작합니다.
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            # requests는 스케줄링 기준, limits는 컨테이너 메모리 상한입니다.
            requests:
              # 평시 사용량보다 낮지 않게 예약해 부하 중 노드 메모리 경합을 줄입니다.
              cpu: 50m
              memory: 384Mi
            limits:
              # Spring 초기화 시 CPU burst를 허용해 rollout 제한시간 내 기동되도록 합니다.
              cpu: 500m
              # 200 RPS 부하에서 확인된 512Mi OOM을 수용하고 native memory 여유를 확보합니다.
              memory: 768Mi
          securityContext:
            # root 실행과 불필요한 Linux capability를 차단합니다.
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            # 이미지 내부 애플리케이션 사용자 UID/GID로 실행합니다.
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
      volumes:
        - name: access-public-key
          secret:
            secretName: app-runtime-secrets
            items:
              - key: access-public-key.pem
                path: access-public-key.pem
---
# Ingress가 Gateway Pod를 안정적인 내부 주소 gateway-service:80으로 호출합니다.
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: app
spec:
  # type 생략 시 기본값 ClusterIP이며 외부에는 Ingress만 공개됩니다.
  selector:
    # 이 label을 가진 Gateway Pod로만 트래픽을 전달합니다.
    app: gateway-service
  ports:
    - name: http
      port: 80
      # Service 80 포트를 컨테이너의 이름 있는 http 포트(8080)로 전달합니다.
      targetPort: http
