# AI 전용 DB·Redis·Kafka와 Data EC2 Elasticsearch를 사용하는 AI 서비스입니다.
# 이 파일은 Deployment와 내부 통신용 ClusterIP Service를 함께 선언합니다.
# 적용 전 AI DB·Elasticsearch·Redis Secret과 관련 공용 ConfigMap이 존재해야 합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: app
  labels:
    app: ai-service
spec:
  # 단일 노드 환경에서 1개 Pod를 실행하며 모델 처리량을 확인한 뒤 확장합니다.
  replicas: 1
  # 새 Pod가 Ready가 된 뒤 기존 Pod를 내리므로 정상 배포 중 서비스 공백을 방지합니다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z 10.30.2.93 5433 && nc -z 10.30.2.93 9200 && nc -z config-server.platform.svc.cluster.local 8888 && nc -z kafka.data.svc.cluster.local 9092 && nc -z redis.data.svc.cluster.local 6379 && nc -z payment-service 80 && nc -z core-service 80; do sleep 5; done"]
          resources:
            requests: {cpu: 1m, memory: 4Mi}
            limits: {cpu: 10m, memory: 16Mi}
      containers:
        - name: ai-service
          image: ghcr.io/prgrms-be-adv-devcourse/lastdish-ai-service:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: Asia/Seoul
            - name: JAVA_TOOL_OPTIONS
              # Spring Boot 4 환경변수 변환의 모호성을 피해 시스템 속성의 점·하이픈을 정확히 전달합니다.
              value: >-
                -XX:InitialRAMPercentage=60.0 -XX:MaxRAMPercentage=60.0 -Duser.timezone=Asia/Seoul
                -Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true
            - name: CONFIG_SERVER_URL
              value: http://config-server.platform.svc.cluster.local:8888
            - name: SERVICES_CORE_BASE_URL
              value: http://core-service
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
            - name: SPRINGDOC_ENABLED
              value: "true"
            - name: AI_DB_URL
              valueFrom: {configMapKeyRef: {name: app-runtime-config, key: AI_DB_URL}}
            - name: AI_DB_USERNAME
              valueFrom: {secretKeyRef: {name: app-runtime-secrets, key: AI_DB_USERNAME}}
            - name: AI_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: app-runtime-secrets, key: AI_DB_PASSWORD}}
            - name: ELASTICSEARCH_URL
              valueFrom: {configMapKeyRef: {name: app-runtime-config, key: ELASTICSEARCH_URL}}
            - name: ELASTICSEARCH_USERNAME
              valueFrom: {configMapKeyRef: {name: app-runtime-config, key: ELASTICSEARCH_USERNAME}}
            - name: ELASTICSEARCH_PASSWORD
              valueFrom: {secretKeyRef: {name: app-runtime-secrets, key: ELASTICSEARCH_PASSWORD}}
            - name: REDIS_HOST
              valueFrom: {configMapKeyRef: {name: app-runtime-config, key: REDIS_HOST}}
            - name: REDIS_PORT
              valueFrom: {configMapKeyRef: {name: app-runtime-config, key: REDIS_PORT}}
            - name: REDIS_USERNAME
              valueFrom: {configMapKeyRef: {name: app-runtime-config, key: REDIS_USERNAME}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: app-runtime-secrets, key: REDIS_PASSWORD}}
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: {configMapKeyRef: {name: app-runtime-config, key: KAFKA_BOOTSTRAP_SERVERS}}
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: app-runtime-secrets, key: OPENAI_API_KEY}}
            - name: OPENAI_EMBEDDING_MODEL
              valueFrom: {secretKeyRef: {name: app-runtime-secrets, key: OPENAI_EMBEDDING_MODEL}}
            - name: OPENAI_CHAT_MODEL
              valueFrom: {secretKeyRef: {name: app-runtime-secrets, key: OPENAI_CHAT_MODEL}}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            # requests는 스케줄링 예약량이며 CPU limit은 색인·가공 피크를 수용하도록 두지 않습니다.
            requests: {cpu: 50m, memory: 256Mi}
            # Elasticsearch client와 JVM native memory 여유를 포함한 컨테이너 상한입니다.
            limits: {cpu: 400m, memory: 1024Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
# 다른 Pod는 ai-service.app.svc.cluster.local 또는 같은 Namespace의 ai-service로 접근합니다.
metadata:
  name: ai-service
  namespace: app
spec:
  type: ClusterIP
  selector: {app: ai-service}
  ports:
    - {name: http, port: 80, targetPort: http}
