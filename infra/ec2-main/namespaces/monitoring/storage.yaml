# Prometheus와 Grafana 데이터를 Kubernetes 노드 로컬 디스크에 보존하는 PV/PVC 모음입니다.
# 적용 전 노드의 /var/lib/lastdish/prometheus와 /var/lib/lastdish/grafana 경로를 생성해야 합니다.
# Retain 정책이므로 PVC 삭제 후에도 데이터가 남으며, 수동 삭제 전 백업 여부를 확인합니다.
# Prometheus 시계열 데이터를 Kubernetes 노드 로컬 디스크에 보존합니다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /var/lib/lastdish/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - team03-k8s
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 10Gi
  volumeName: prometheus-data-pv
---
# Grafana 사용자 설정과 대시보드를 Kubernetes 노드 로컬 디스크에 보존합니다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /var/lib/lastdish/grafana
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - team03-k8s
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 1Gi
  volumeName: grafana-data-pv
