# Grafana UI와 내부 ClusterIP Service를 배포하고 provisioning ConfigMap·PVC를 마운트합니다.
# 적용 전 grafana-admin Secret, grafana-datasources, dashboard ConfigMap과 grafana-data PVC가 필요합니다.
# Recreate 전략이므로 재배포 중 짧은 UI 중단은 있지만 저장 데이터는 PVC에 유지됩니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  # 단일 ReadWriteOnce Local PV를 사용하므로 동시에 두 Pod가 볼륨을 마운트하지 않게 합니다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: grafana
          image: grafana/grafana:13.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Grafana가 자동 생성하는 범례 계산명(Last, Max 등)과 UI의 기본 표시 언어입니다.
            # 사용자 프로필에서 언어를 따로 선택한 경우 개인 설정이 이 값보다 우선합니다.
            - name: GF_USERS_DEFAULT_LANGUAGE
              value: ko-KR
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Grafana가 리다이렉트와 링크 생성에 사용할 외부 HTTPS 주소입니다.
            - name: GF_SERVER_DOMAIN
              value: grafana.lastdish.kr
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.lastdish.kr
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: service-dashboard
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              # 단일 노드 RollingUpdate가 새 서비스 Pod를 배치할 CPU 여유를 남깁니다.
              memory: 256Mi
            limits:
              # 대시보드 인덱싱과 플러그인 초기화 순간의 메모리 증가를 수용합니다.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
            capabilities:
              drop:
                - ALL
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: service-dashboard
          configMap:
            name: grafana-dashboard-lastdish-services
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
# 초기에는 외부 공개하지 않고 kubectl port-forward로만 접속합니다.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
