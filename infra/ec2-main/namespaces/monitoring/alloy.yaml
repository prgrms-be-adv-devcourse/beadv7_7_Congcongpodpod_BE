# Kubernetes API로 app/platform/data Pod 로그를 읽어 ec2-log Loki로 전달합니다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-pod-logs
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-pod-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-pod-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "service_pod_logs" {
      targets = discovery.kubernetes.pods.targets

      // 애플리케이션, 플랫폼, Redis·Kafka 로그만 수집합니다.
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "app|platform|data"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "application"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app"]
        separator     = "/"
        target_label  = "job"
      }
    }

    loki.source.kubernetes "service_pods" {
      targets    = discovery.relabel.service_pod_logs.output
      forward_to = [loki.write.ec2_log.receiver]
    }

    // 외부 인터넷 경로가 없는 Data EC2 Alloy의 Loki push를 VPC 내부에서 받아 Home Loki로 중계합니다.
    loki.source.api "data_relay" {
      http {
        listen_address = "0.0.0.0"
        listen_port    = 3101
      }
      use_incoming_timestamp = true
      forward_to              = [loki.write.ec2_log.receiver]
    }

    loki.write "ec2_log" {
      endpoint {
        url = "https://log.lastdish.kr/loki/api/v1/push"
        basic_auth {
          username = sys.env("LOKI_BASIC_AUTH_USER")
          password = sys.env("LOKI_BASIC_AUTH_PASSWORD")
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app: alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        runAsNonRoot: true
      containers:
        - name: alloy
          image: grafana/alloy:v1.18.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
            - /etc/alloy/config.alloy
          env:
            - name: LOKI_BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: monitoring-runtime-secrets
                  key: LOKI_BASIC_AUTH_USER
            - name: LOKI_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitoring-runtime-secrets
                  key: LOKI_BASIC_AUTH_PASSWORD
          ports:
            - name: http
              containerPort: 12345
            - name: loki-relay
              containerPort: 3101
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: storage
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: storage
          emptyDir: {}
---
# Data EC2에서만 접근하는 Loki push 중계 포트입니다. AWS 보안 그룹도 Data EC2 SG로 제한합니다.
apiVersion: v1
kind: Service
metadata:
  name: alloy-loki-relay
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: alloy
  ports:
    - name: loki-push
      port: 3101
      targetPort: loki-relay
      nodePort: 30100
