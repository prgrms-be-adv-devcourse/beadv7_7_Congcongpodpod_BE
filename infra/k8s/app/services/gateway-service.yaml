# 외부 API 요청의 단일 진입점으로 라우팅과 JWT 검증을 담당합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: app
  labels:
    app: gateway-service
spec:
  # 현재 단일 노드·소규모 트래픽 기준 1개 Pod를 운영합니다.
  replicas: 1
  # 신규 Pod가 Ready 상태가 되기 전에는 기존 Pod를 종료하지 않습니다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # 신규 Pod가 10초간 Ready 상태를 유지해야 배포 성공으로 판단합니다.
  minReadySeconds: 10
  revisionHistoryLimit: 5
  # 아래 Pod template의 app label과 일치하는 Pod만 이 Deployment가 관리합니다.
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: gateway-service
          image: ghcr.io/prgrms-be-adv-devcourse/lastdish-gateway-service:dev
          imagePullPolicy: Always
          ports:
            # 이름을 http로 지정하면 Probe와 Service에서 숫자 대신 이름을 재사용할 수 있습니다.
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              # OS 레벨 시간대입니다.
              value: Asia/Seoul
            - name: JAVA_TOOL_OPTIONS
              # JVM 시간대도 별도로 고정해 로그와 날짜 계산 차이를 방지합니다.
              value: -Duser.timezone=Asia/Seoul
            - name: CONFIG_SERVER_URL
              # namespace가 다른 Config Server의 Kubernetes 전체 DNS 이름입니다.
              value: http://config-server.platform.svc.cluster.local:8888
            - name: JWT_PUBLIC_KEY_LOCATION
              # 아래 ConfigMap 볼륨이 실제로 마운트되는 컨테이너 내부 경로입니다.
              value: file:/etc/lastdish/jwt/access-public-key.pem
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  # data 네임스페이스 Redis Service의 Kubernetes DNS입니다.
                  name: redis-client-config
                  key: host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: redis-client-config
                  key: port
            - name: REDIS_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: redis-client-config
                  key: username
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Secret은 네임스페이스를 넘을 수 없어 app에도 동일 자격증명을 둡니다.
                  name: redis-auth
                  key: password
          volumeMounts:
            # ConfigMap의 각 data key가 이 디렉터리 아래 파일로 생성됩니다.
            - name: access-public-key
              mountPath: /etc/lastdish/jwt
              readOnly: true
          readinessProbe:
            # 준비된 Pod만 Service 트래픽을 받습니다.
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            # 5초 간격으로 최대 12회 실패를 허용해 일시적인 준비 지연을 흡수합니다.
            periodSeconds: 5
            failureThreshold: 12
          startupProbe:
            # Spring 초기 기동이 끝날 때까지 liveness 판단을 유예합니다.
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            # 약 5분 동안 초기 기동을 허용한 뒤 실패하면 컨테이너를 재시작합니다.
            failureThreshold: 30
          livenessProbe:
            # 기동 후 응답 불능 상태가 지속되면 컨테이너를 재시작합니다.
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            # requests는 스케줄링 기준, limits는 컨테이너 메모리 상한입니다.
            requests:
              # 스케줄러는 최소 100m CPU와 256MiB 메모리가 있는 노드에 배치합니다.
              cpu: 100m
              memory: 256Mi
            limits:
              # 평시 약 203Mi 사용량에 JVM 순간 증가 여유를 포함한 상한입니다.
              memory: 320Mi
          securityContext:
            # root 실행과 불필요한 Linux capability를 차단합니다.
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            # 이미지 내부 애플리케이션 사용자 UID/GID로 실행합니다.
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
      volumes:
        - name: access-public-key
          configMap:
            # gateway-jwt-public-key.yaml에서 선언한 ConfigMap입니다.
            name: gateway-jwt-public-key
---
# Ingress가 Gateway Pod를 안정적인 내부 주소 gateway-service:80으로 호출합니다.
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: app
spec:
  # type 생략 시 기본값 ClusterIP이며 외부에는 Ingress만 공개됩니다.
  selector:
    # 이 label을 가진 Gateway Pod로만 트래픽을 전달합니다.
    app: gateway-service
  ports:
    - name: http
      port: 80
      # Service 80 포트를 컨테이너의 이름 있는 http 포트(8080)로 전달합니다.
      targetPort: http
