apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-client-config
  namespace: app
data:
  # bootstrap 서버는 최초 metadata 조회용 주소입니다. 조회 후에는 broker가 advertised listener를 반환합니다.
  # Kafka는 data 네임스페이스의 ClusterIP Service로만 노출되므로 인터넷에서는 접근할 수 없습니다.
  # Member/Core Deployment가 이 key를 KAFKA_BOOTSTRAP_SERVERS 환경변수로 주입합니다.
  bootstrap-servers: kafka.data.svc.cluster.local:9092
