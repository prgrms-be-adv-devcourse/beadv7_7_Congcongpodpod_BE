# Prometheus가 자기 자신과 Data EC2의 exporter를 30초마다 수집합니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: member-postgresql
        static_configs:
          - targets:
              - 10.30.2.93:9187

      - job_name: core-postgresql
        static_configs:
          - targets:
              - 10.30.2.93:9188

      - job_name: elasticsearch
        static_configs:
          - targets:
              - 10.30.2.93:9114

      # Deployment replica, Pod 상태, restart, request/limit 같은 Kubernetes 객체 상태를 수집합니다.
      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.monitoring.svc.cluster.local:8080

      # kubelet 내장 cAdvisor를 API Server proxy로 조회해 Pod·컨테이너 리소스를 수집합니다.
      - job_name: kubernetes-cadvisor
        scheme: https
        kubernetes_sd_configs:
          - role: node
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels:
              - __meta_kubernetes_node_name
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # prometheus.io/scrape=true annotation이 붙은 Spring Pod를 IP 변경과 무관하게 자동 발견합니다.
      - job_name: kubernetes-spring-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # cert-manager처럼 자체 annotation을 가진 시스템 Pod는 제외하고 우리 Spring 영역만 수집합니다.
          - source_labels:
              - __meta_kubernetes_namespace
            action: keep
            regex: (app|platform)
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            action: keep
            regex: "true"
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            target_label: __metrics_path__
            regex: (.+)
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: application
