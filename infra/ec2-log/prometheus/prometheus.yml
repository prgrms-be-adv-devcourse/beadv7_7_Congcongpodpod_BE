global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus-home
    static_configs:
      - targets: [localhost:9090]

  - job_name: member-postgresql
    static_configs:
      - targets: [ssh-tunnel:19187]

  - job_name: core-postgresql
    static_configs:
      - targets: [ssh-tunnel:19188]

  - job_name: payment-postgresql
    static_configs:
      - targets: [ssh-tunnel:19189]

  - job_name: ai-postgresql
    static_configs:
      - targets: [ssh-tunnel:19190]

  - job_name: elasticsearch
    static_configs:
      - targets: [ssh-tunnel:19114]

  - job_name: main-node-exporter
    static_configs:
      - targets: [ssh-tunnel:19100]
        labels:
          server: Main EC2

  - job_name: data-node-exporter
    static_configs:
      - targets: [ssh-tunnel:19101]
        labels:
          server: Data EC2

  - job_name: data-cadvisor
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: [ssh-tunnel:18080]
        labels:
          server: Data EC2

  - job_name: kube-state-metrics
    scheme: https
    metrics_path: /api/v1/namespaces/monitoring/services/http:kube-state-metrics:8080/proxy/metrics
    static_configs:
      - targets: [ssh-tunnel:16443]
    authorization:
      credentials_file: /etc/prometheus/kubernetes/token
    tls_config:
      ca_file: /etc/prometheus/kubernetes/ca.crt
      server_name: kubernetes

  - job_name: kubernetes-cadvisor
    scheme: https
    metrics_path: /api/v1/nodes/team03-k8s/proxy/metrics/cadvisor
    static_configs:
      - targets: [ssh-tunnel:16443]
    authorization:
      credentials_file: /etc/prometheus/kubernetes/token
    tls_config:
      ca_file: /etc/prometheus/kubernetes/ca.crt
      server_name: kubernetes

  - job_name: kubernetes-spring-pods
    scheme: https
    kubernetes_sd_configs:
      - role: pod
        api_server: https://ssh-tunnel:16443
        authorization:
          credentials_file: /etc/prometheus/kubernetes/token
        tls_config:
          ca_file: /etc/prometheus/kubernetes/ca.crt
          server_name: kubernetes
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: (app|platform)
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name, __meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_annotation_prometheus_io_path]
        separator: ";"
        target_label: __metrics_path__
        regex: "([^;]+);([^;]+);([^;]+);(.+)"
        replacement: /api/v1/namespaces/$1/pods/http:$2:$3/proxy$4
      - target_label: __address__
        replacement: ssh-tunnel:16443
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: application
    authorization:
      credentials_file: /etc/prometheus/kubernetes/token
    tls_config:
      ca_file: /etc/prometheus/kubernetes/ca.crt
      server_name: kubernetes
