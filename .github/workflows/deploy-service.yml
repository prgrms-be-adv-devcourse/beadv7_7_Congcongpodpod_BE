name: Deploy Service

on:
  workflow_call:
    inputs:
      deployment:
        description: Kubernetes Deployment name
        required: true
        type: string
      namespace:
        description: Kubernetes namespace
        required: true
        type: string
    secrets:
      EC2_HOST:
        required: true
      EC2_SSH_PRIVATE_KEY:
        required: true
      EC2_SSH_KNOWN_HOSTS:
        required: true

jobs:
  deploy:
    # 서비스별 이미지 빌드는 병렬로 수행하되, 단일 Kubernetes 노드의 rollout은 직렬화합니다.
    # 같은 concurrency group을 사용하는 배포가 실행 중이면 다음 배포는 취소되지 않고 대기합니다.
    concurrency:
      group: lastdish-production-deploy
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Deploy and rollback on failure
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DEPLOYMENT: ${{ inputs.deployment }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          # 매니페스트와 ConfigMap은 운영 서버에 별도로 적용합니다.
          # Actions는 이미 존재하는 Deployment의 새 이미지만 순차적으로 재기동합니다.
          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            ec2-user@"$EC2_HOST" \
            bash -s -- "$NAMESPACE" "$DEPLOYMENT" <<'REMOTE'
          set -u

          namespace=$1
          deployment=$2

          if ! kubectl rollout restart "deployment/$deployment" --namespace="$namespace"; then
            echo "Failed to start the deployment rollout."
            exit 1
          fi

          if kubectl rollout status "deployment/$deployment" \
            --namespace="$namespace" \
            --timeout=300s; then
            exit 0
          fi

          echo "Deployment failed; restoring the previous revision."
          kubectl rollout undo "deployment/$deployment" --namespace="$namespace"
          kubectl rollout status "deployment/$deployment" \
            --namespace="$namespace" \
            --timeout=300s || true

          # 롤백 성공 여부와 관계없이 실패한 배포는 Actions에서 실패로 표시합니다.
          exit 1
          REMOTE
