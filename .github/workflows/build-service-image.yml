name: Build Service Image

on:
  workflow_call:
    inputs:
      service-name:
        description: Gradle service module and image name
        required: true
        type: string
      publish:
        description: Push the built image to GHCR
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    # 서비스 테스트가 Redis 캐시·토큰 블랙리스트를 실제로 검증할 수 있도록 제공합니다.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*

      # Gradle 빌드 캐시를 저장·복원해 공유 모듈(api-common, mvc-common 등)을 매 실행마다
      # 다시 컴파일하지 않게 한다. setup-java의 cache는 의존성(modules-2)만 다루고 빌드 산출물은 제외다.
      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-

      - name: Test and package service
        working-directory: backend
        env:
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: >-
          ./gradlew
          ":services:${{ inputs.service-name }}:test"
          ":services:${{ inputs.service-name }}:bootJar"
          --no-daemon

      - name: Set up Docker Buildx
        # PR은 이미지를 배포하지 않으므로 빌드 자체를 건너뛴다. 이미지 검증은 main push(배포) 때 수행한다.
        if: inputs.publish
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        if: inputs.publish
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lastdish-${{ inputs.service-name }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-

      - name: Build and push image
        if: inputs.publish
        uses: docker/build-push-action@v7
        with:
          context: backend/services/${{ inputs.service-name }}/build/libs
          file: backend/services/${{ inputs.service-name }}/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}
