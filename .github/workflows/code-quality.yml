name: Code Quality

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: code-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  spotless:
    name: Spotless Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*

      # 서비스 테스트와 JAR·이미지 빌드는 backend-services 워크플로우에서 변경 서비스별로 수행합니다.
      # 이 워크플로우는 동일 테스트의 중복 실행을 피하고 코드 포맷만 빠르게 검증합니다.
      - name: Verify formatting
        working-directory: backend
        run: ./gradlew spotlessCheck --no-daemon
