name: lastdish-local

services:
  member-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: member_db
      POSTGRES_USER: member
      POSTGRES_PASSWORD: member_local_password
    ports:
      - "54321:5432"
    volumes:
      - member-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U member -d member_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: core_db
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core_local_password
    ports:
      - "54322:5432"
    volumes:
      - core-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.1-alpine
    environment:
      # 로컬 기본값이며, 실행 전에 REDIS_PASSWORD 환경변수로 재정의할 수 있습니다.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_password}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Apache 공식 JVM 이미지를 사용하며 Kubernetes와 같은 버전으로 고정합니다.
    image: apache/kafka:4.2.1
    environment:
      # Kafka 데이터 볼륨을 유지하는 동안 변경하면 안 되는 KRaft 클러스터 ID입니다.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # 단일 노드 ID이며 controller quorum voter ID와 일치해야 합니다.
      KAFKA_NODE_ID: 1
      # ZooKeeper 없이 하나의 프로세스가 broker와 controller를 함께 담당합니다.
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL은 Compose 서비스, EXTERNAL은 호스트 도구, CONTROLLER는 KRaft 전용입니다.
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      # metadata 응답에서 Docker 클라이언트에는 kafka:19092, 호스트에는 localhost:9092를 알립니다.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      # 로컬 환경이므로 세 listener 모두 인증·암호화 없는 PLAINTEXT를 사용합니다.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # controller와 broker 내부 통신이 사용할 listener 이름입니다.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 단일 controller의 `nodeId@host:port`입니다.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      # broker가 하나이므로 Kafka 내부 topic의 복제·최소 동기화 복제본을 모두 1로 둡니다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 첫 Consumer group 시작 시 불필요한 대기 시간을 제거합니다.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topic 생성 시 별도 지정이 없으면 partition 3개를 사용합니다.
      KAFKA_NUM_PARTITIONS: 3
      # 오타 topic 자동 생성을 막고, 관리자가 필요 없는 topic은 삭제할 수 있게 합니다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      # 각 partition 로그는 최대 72시간 또는 5GiB까지 보존합니다.
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 5368709120
      # 256Mi segment 단위로 오래된 로그를 정리합니다.
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      # named volume이 마운트된 경로에 메시지와 KRaft metadata를 저장합니다.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 전체 1280Mi 중 JVM heap은 512Mi로 고정하고 나머지는 native/page cache에 남깁니다.
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      # 개발 PC의 Kafka 도구는 localhost:9092로 접근할 수 있습니다.
      - "9092:9092"
    volumes:
      # compose down 후에도 유지되며 `docker compose down -v`에서만 삭제됩니다.
      - kafka-data:/var/lib/kafka/data
    # JVM heap뿐 아니라 native memory와 page cache까지 포함한 컨테이너 상한입니다.
    mem_limit: 1280m
    healthcheck:
      # 단순 포트 확인보다 강하게 Kafka protocol metadata 응답까지 검사합니다.
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:19092"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  config-server:
    build:
      context: ./backend
      dockerfile: services/config-server/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_NATIVE_SEARCH_LOCATIONS: file:/config
    volumes:
      - ./infra/local/config:/config:ro
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  member-service:
    build:
      context: ./backend
      dockerfile: services/member-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      CONFIG_SERVER_URL: http://config-server:8888
      MEMBER_DB_URL: jdbc:postgresql://member-db:5432/member_db
      MEMBER_DB_USERNAME: member
      MEMBER_DB_PASSWORD: member_local_password
      JWT_ACCESS_PRIVATE_KEY_LOCATION: file:/run/secrets/access-private-key.pem
      JWT_ACCESS_PUBLIC_KEY_LOCATION: file:/run/secrets/access-public-key.pem
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    secrets:
      - source: access-private-key
        target: access-private-key.pem
      - source: access-public-key
        target: access-public-key.pem
    depends_on:
      config-server:
        condition: service_healthy
      member-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"

  core-service:
    build:
      context: ./backend
      dockerfile: services/core-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      CONFIG_SERVER_URL: http://config-server:8888
      CORE_DB_URL: jdbc:postgresql://core-db:5432/core_db
      CORE_DB_USERNAME: core
      CORE_DB_PASSWORD: core_local_password
      MEMBER_SERVICE_BASE_URL: http://member-service:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      config-server:
        condition: service_healthy
      core-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8080"

  gateway-service:
    build:
      context: ./backend
      dockerfile: services/gateway-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/access-public-key.pem
      GATEWAY_CORS_ORIGIN: "*"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_password}
    secrets:
      - source: access-public-key
        target: access-public-key.pem
    depends_on:
      config-server:
        condition: service_healthy
      member-service:
        condition: service_started
      core-service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

secrets:
  access-private-key:
    file: ./infra/local/keys/access-private-key.pem
  access-public-key:
    file: ./infra/local/keys/access-public-key.pem

volumes:
  member-db-data:
  core-db-data:
  # Kafka 메시지와 KRaft metadata를 보존하는 Docker named volume입니다.
  kafka-data:
