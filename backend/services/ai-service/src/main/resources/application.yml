server:
  port: 8084

spring:
  application:
    name: ai-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  datasource:
    url: jdbc:postgresql://localhost:54322/ai_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  codec:
    max-in-memory-size: 10MB

ai:
  engine:
    url: ${AI_ENGINE_URL:https://mushily-hangup-smartness.ngrok-free.dev}