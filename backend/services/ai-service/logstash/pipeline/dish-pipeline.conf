input {
  jdbc {
    # PostgreSQL JDBC 드라이버 설정
    jdbc_driver_library => "/usr/share/logstash/logstash-core/lib/jars/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://${CORE_DB_URL:core-db:5432/core_db}"
    jdbc_user => "${CORE_DB_USERNAME:core}"
    jdbc_password => "${CORE_DB_PASSWORD:core_local_password}"

    schedule => "* * * * *"

    # PostgreSQL 전용 시간차 계산 구문 및 EXTRACT(EPOCH FROM ...)
    statement => "
      SELECT
        d.id AS dish_id,
        d.store_id AS store_id,
        s.name AS store_name,
        d.dish_name AS dish_name,
        d.description AS description,
        d.thumbnail_url AS thumbnail_url,
        d.stock_quantity AS stock_quantity,
        d.dish_status AS dish_status,
        d.dish_price AS dish_price,
        d.discount_price AS discount_price,
        d.registered_at AS registered_at,
        CAST(EXTRACT(EPOCH FROM d.updated_at) AS BIGINT) AS version
      FROM dish d
      LEFT JOIN store s ON d.store_id = s.id
      WHERE d.updated_at >= NOW() - INTERVAL '1 minute'
    "
  }
}

filter {
  mutate {
    rename => {
      "dish_id" => "dishId"
      "store_id" => "storeId"
      "store_name" => "storeName"
      "dish_name" => "dishName"
      "thumbnail_url" => "thumbnailUrl"
      "stock_quantity" => "stockQuantity"
      "dish_status" => "dishStatus"
      "dish_price" => "dishPrice"
      "discount_price" => "discountPrice"
      "registered_at" => "registeredAt"
    }
    remove_field => ["@version", "@timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
    user => "elastic"
    password => "${ELASTICSEARCH_PASSWORD:elastic_local_password}"
    index => "dishes"
    document_id => "%{dishId}"
    action => "index"
    version => "%{version}"
    version_type => "external"
  }
}