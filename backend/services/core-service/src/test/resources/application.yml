spring:
  application:
    name: core-service
  cloud:
    config:
      enabled: false
  flyway:
    enabled: false
  kafka:
    admin:
      auto-create: false
    listener:
      auto-startup: false

services:
  member:
    base-url: http://localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

event:
  publisher: spring
  kafka:
    listener-auto-startup: false

outbox:
  scheduler:
    enabled: false
  polling-delay-ms: 1000
  batch-size: 100
  max-retries: 5
  lock-timeout-seconds: 60
