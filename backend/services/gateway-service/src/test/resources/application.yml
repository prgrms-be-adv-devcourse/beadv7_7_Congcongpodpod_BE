spring:
  application:
    name: gateway-service
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/api/**]":
                allowed-origins:
                  - https://lastdish.kr
                  - https://www.lastdish.kr
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type]
                max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,refresh
  endpoint:
    gateway:
      access: unrestricted

gateway:
  security:
    jwt:
      issuer: lastdish-member-service
      public-key-location: classpath:keys/test-public-key.pem
