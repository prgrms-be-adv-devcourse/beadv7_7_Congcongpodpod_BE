plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.0'
    }
}

dependencies {
    implementation project(':modules:api-common')

    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-webmvc'
    implementation 'org.springframework:spring-context'
    implementation 'org.slf4j:slf4j-api'

    // DataIntegrityViolationException 처리용. JPA를 쓰는 서비스에는 런타임에 이미 들어와 있고,
    // 없는 서비스에서는 해당 핸들러만 등록되지 않도록 조건을 걸어 두었다.
    compileOnly 'org.springframework:spring-tx'

    // 요청당 SQL 실행 수 계측용. spring-tx와 같은 이유로 compileOnly다.
    compileOnly 'org.hibernate.orm:hibernate-core'
    compileOnly 'org.springframework.boot:spring-boot-hibernate'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jackson'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework:spring-tx'
    testImplementation 'org.hibernate.orm:hibernate-core'
    testImplementation 'org.springframework.boot:spring-boot-hibernate'
}

tasks.named('test') {
    useJUnitPlatform()
}
